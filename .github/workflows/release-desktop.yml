name: Release Desktop

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel (stable/canary)'
        required: false
        default: 'stable'

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build
        working-directory: desktop
        run: wails build -platform darwin/universal -o NeoCode.app
      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg --volname "NeoCode" --window-pos 200 120 --window-size 600 400 \
            --icon-size 100 --app-drop-link 425 175 \
            NeoCode.dmg desktop/build/bin/NeoCode.app
      - uses: actions/upload-artifact@v4
        with:
          name: neocode-macos
          path: NeoCode.dmg

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build
        working-directory: desktop
        run: wails build -platform windows/amd64 -o NeoCode.exe
      - uses: actions/upload-artifact@v4
        with:
          name: neocode-windows
          path: desktop/build/bin/

  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build
        working-directory: desktop
        run: wails build -platform linux/amd64 -o neocode
      - uses: actions/upload-artifact@v4
        with:
          name: neocode-linux
          path: desktop/build/bin/

  release:
    name: Create Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            neocode-macos/*
            neocode-windows/*
            neocode-linux/*
          draft: true
          prerelease: ${{ github.event.inputs.channel == 'canary' }}
